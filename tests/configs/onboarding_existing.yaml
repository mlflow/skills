name: onboarding_existing
project_dir: agent
setup_script: tests/scripts/setup_environment_cases.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/environment_behavior.py
skills:
  - mlflow-onboarding
prompt: >-
  Use mlflow-onboarding to verify this existing GenAI project is ready. backend.json and .env are already configured. Reuse them and run agent.py to verify a persisted application trace. Do not replace the configuration or create an experiment. No questions.
timeout_seconds: 600
mlflow_port: 32980
environment:
  TEST_CASE: existing_backend
  EXPECTED_SKILLS: mlflow-onboarding
  MLFLOW_HTTP_REQUEST_TIMEOUT: "2"
  MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"
