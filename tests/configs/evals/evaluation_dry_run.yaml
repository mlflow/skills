name: evaluation-broken-predictor-dry-run
project_dir: project
setup_script: tests/scripts/setup_evaluation_cases.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/evaluation_behavior.py
skills:
  - mlflow-evaluation
  - mlflow-tracing
required_skills: [mlflow-evaluation]
prompt: "Evaluate the order assistant. If the backend isn't ready, stop and explain the blocker."
timeout_seconds: 600
environment:
  MLFLOW_SERVER_ENABLE_CUSTOM_SCORERS: "true"
  EVALUATION_CASE: dry_run
