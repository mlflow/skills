# Requires DSPy plus working judge/reflection and embedding provider credentials.
name: scorer-memalign
project_dir: project
setup_script: tests/scripts/setup_evaluation_cases.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/evaluation_behavior.py
skills:
  - mlflow-evaluation
required_skills: [mlflow-evaluation]
prompt: "Align our order-total judge with the expert feedback and compare it with the original."
verification_timeout: 600
environment:
  EVALUATION_CASE: alignment_live
