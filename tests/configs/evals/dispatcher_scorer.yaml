name: dispatcher_scorer
project_dir: agent
setup_script: tests/scripts/setup_environment_cases.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/environment_behavior.py
skills:
  - mlflow-agent
  - mlflow-evaluation
  - mlflow-tracing
required_skills: [mlflow-agent, mlflow-evaluation]
prompt: "Add an MLflow scorer called answer_present in scorers.py. It should fail for missing, null, empty, or whitespace-only answers."
timeout_seconds: 600
environment:
  TEST_CASE: dispatcher
