name: agent-evaluation-nested-kwargs
project_dir: mlflow-agent
setup_script: tests/scripts/setup_evaluation_cases.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/evaluation_behavior.py
skills:
  - agent-evaluation
  - instrumenting-with-mlflow-tracing
required_skills: [agent-evaluation]
prompt: "Evaluate my order assistant and tell me which examples it gets wrong."
environment:
  MLFLOW_SERVER_ENABLE_CUSTOM_SCORERS: "true"
  EVALUATION_CASE: nested
