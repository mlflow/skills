name: agent-evaluation-nested-kwargs
project_dir: mlflow-agent
setup_script: tests/scripts/setup_agent_eval.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/evaluation_behavior.py
skills:
  - agent-evaluation
  - instrumenting-with-mlflow-tracing
prompt: >-
  Evaluate this agent's output quality. Reuse working
  tracing. Read README.md for the approved purpose and criteria. Evaluate with native
  MLflow datasets and registered scorers. Run the dry run before full
  evaluation, retain row-level outputs and scores, and report failures honestly.
  Do not ask for input. If this is an external repository, preserve its configured
  scorer model and follow its own entry point and data contracts.
timeout_seconds: 900
mlflow_port: 32960
tracking_uri: null
test_runs_dir: /tmp
keep_workdir: true
environment:
  MLFLOW_SERVER_ENABLE_CUSTOM_SCORERS: "true"
  MLFLOW_ALLOW_PICKLE_DESERIALIZATION: "true"
  EXPECTED_SKILLS: agent-evaluation
  EVALUATION_CASE: nested
