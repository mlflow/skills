name: "agent-debug-trace-first"
project_dir: routing-agent

setup_script: tests/scripts/setup_agent_debug_trace_first.py
judges:
  - tests/judges/agent_debugged_from_trace.py

skills:
  - fix-agent-issue

prompt: "The routing agent sends refund requests to sales instead of support. Debug and fix the agent. Do not ask for input."
timeout_seconds: 900
allowed_tools: "Bash,Read,Write,Edit,Grep,Glob"

mlflow_port: 32945
tracking_uri: null

test_runs_dir: /tmp
keep_workdir: true
