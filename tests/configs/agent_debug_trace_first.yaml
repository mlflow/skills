name: "agent-debug-trace-first"
project_dir: routing-agent

setup_script: tests/scripts/setup_agent_debug_trace_first.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/agent_debugged_from_trace.py

skills:
