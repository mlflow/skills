name: onboarding-classic-ml
project_dir: project
setup_script: tests/scripts/setup_environment_cases.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/environment_behavior.py
skills:
  - mlflow-onboarding
  - searching-mlflow-docs
prompt: >-
  Use mlflow-onboarding to integrate MLflow into this traditional sklearn training project.
  Read train.py and backend.json. Reuse the existing tracking server and experiment.
  Preserve the training data and model behavior, log mse and fit_intercept=True,
  and log the fitted sklearn model. Run training and verify you can reload the
  logged model. Do not add GenAI tracing or evaluation. No questions.
timeout_seconds: 600
mlflow_port: 32986
environment:
  TEST_CASE: classic_ml
  EXPECTED_SKILLS: mlflow-onboarding
