name: evaluation-broken-predictor-dry-run
project_dir: project
setup_script: tests/scripts/setup_evaluation_cases.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/evaluation_behavior.py
skills:
  - agent-evaluation
  - instrumenting-with-mlflow-tracing
prompt: >-
  Use agent-evaluation and instrumenting-with-mlflow-tracing to evaluate the order
  assistant. Read README.md for approved criteria and operational constraints.
  Discover the existing dataset and scorer, attempt the required dry run, and
  honor its decision gate before any full evaluation. Save a machine-readable
  outcome.json explaining the disposition and whether full evaluation started.
  Do not ask for input or invent credentials.
timeout_seconds: 600
mlflow_port: 32962
tracking_uri: null
keep_workdir: true
environment:
  MLFLOW_SERVER_ENABLE_CUSTOM_SCORERS: "true"
  MLFLOW_ALLOW_PICKLE_DESERIALIZATION: "true"
  EXPECTED_SKILLS: agent-evaluation,instrumenting-with-mlflow-tracing
  EVALUATION_CASE: dry_run
