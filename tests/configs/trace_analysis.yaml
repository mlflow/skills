name: trace-analysis
project_dir: trace-investigation
setup_script: tests/scripts/setup_trace_cases.py
judges:
- tests/judges/skill_usage.py
- tests/judges/trace_behavior.py
skills:
- analyze-mlflow-trace
- retrieving-mlflow-traces
prompt: Use analyze-mlflow-trace. Use retrieving-mlflow-traces. Read task.json for the investigation scope.
  Investigate task.json.trace_id. Identify the failing child span and the concrete root cause using its
  inputs and status, distinguishing it from the parent error and successful spans. Write outcome.json
  with trace_id, failing_span_id, root_cause (tool_timeout, retrieval_error, or generation_error), order_id,
  timeout_ms, service_latency_ms. Values must come from the actual trace. Explain the diagnosis in your
  final response; leave source unchanged.
timeout_seconds: 600
allowed_tools: Skill,Bash,Read,Write,Edit,Grep,Glob
mlflow_port: 32971
tracking_uri: null
test_runs_dir: /tmp
keep_workdir: true
environment:
  TEST_CASE: trace_analysis
  EXPECTED_SKILLS: analyze-mlflow-trace,retrieving-mlflow-traces
