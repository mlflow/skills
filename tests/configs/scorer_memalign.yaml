# Requires DSPy plus working judge/reflection and embedding provider credentials.
name: scorer-memalign
project_dir: project
setup_script: tests/scripts/setup_evaluation_cases.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/evaluation_behavior.py
skills:
  - build-a-scorer
  - agent-evaluation
prompt: >-
  Read README.md and
  implement and run the approved native MemAlign alignment workflow.
  Preserve train/holdout separation and report measured agreement honestly.
timeout_seconds: 900
verification_timeout: 600
mlflow_port: 32966
keep_workdir: true
environment:
  EXPECTED_SKILLS: build-a-scorer
  EVALUATION_CASE: alignment_live
  MLFLOW_SERVER_ENABLE_CUSTOM_SCORERS: "true"
  MLFLOW_ALLOW_PICKLE_DESERIALIZATION: "true"
