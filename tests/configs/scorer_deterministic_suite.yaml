name: scorer-deterministic-quality-suite
project_dir: project
setup_script: tests/scripts/setup_evaluation_cases.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/evaluation_behavior.py
skills:
  - build-a-scorer
prompt: "Build the order-quality scorers described in README.md."
timeout_seconds: 600
environment:
  MLFLOW_SERVER_ENABLE_CUSTOM_SCORERS: "true"
  MLFLOW_ALLOW_PICKLE_DESERIALIZATION: "true"
  EVALUATION_CASE: suite
