name: tracing_test
project_dir: agent
setup_script: tests/scripts/setup_tracing_test.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/instrumentation_behavior.py
skills:
  - instrumenting-with-mlflow-tracing
prompt: >-
  Add MLflow tracing to the existing application (agent.py in the bundled fixture). Preserve its behavior, run it, flush and retrieve the resulting application traces to verify their recorded inputs and outputs. For an external repository, save the application launch command as a JSON argv array in tracing-command.json so verification can rerun it. No questions.
timeout_seconds: 600
mlflow_port: 32939
environment:
  TEST_CASE: python
  EXPECTED_SKILLS: instrumenting-with-mlflow-tracing
