name: langgraph_autolog_guidance
project_dir: agent
setup_script: tests/scripts/setup_langgraph_autolog_guidance.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/instrumentation_behavior.py
skills:
  - instrumenting-with-mlflow-tracing
prompt: >-
  Use instrumenting-with-mlflow-tracing to add MLflow tracing to the existing LangGraph app in agent.py. Use the existing deterministic model, preserve its graph, run the app and retrieve a persisted trace to verify graph, node and model spans. No questions.
timeout_seconds: 600
mlflow_port: 32941
environment:
  TEST_CASE: langgraph
  EXPECTED_SKILLS: instrumenting-with-mlflow-tracing
