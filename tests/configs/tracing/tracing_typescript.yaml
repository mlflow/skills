name: tracing_typescript
project_dir: agent
setup_script: tests/scripts/setup_tracing_test.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/instrumentation_behavior.py
skills:
  - instrumenting-with-mlflow-tracing
prompt: >-
  Add TypeScript MLflow tracing to agent.ts. Preserve its behavior, execute it, flush and retrieve the resulting application traces to verify their inputs and outputs. No questions.
timeout_seconds: 600
mlflow_port: 32985
environment:
  TEST_CASE: typescript
  EXPECTED_SKILLS: instrumenting-with-mlflow-tracing
