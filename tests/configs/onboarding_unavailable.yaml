name: onboarding_unavailable
project_dir: agent
setup_script: tests/scripts/setup_environment_cases.py
judges:
  - tests/judges/skill_usage.py
  - tests/judges/environment_behavior.py
skills:
  - mlflow-onboarding
prompt: >-
  Check connectivity using backend.json with a two-second request timeout and no retries for this probe. Report the actual readiness and blocker in connection.json as status and reason. Do not switch backend, create experiments, or edit project configuration. No questions.
timeout_seconds: 600
mlflow_port: 32981
environment:
  TEST_CASE: unavailable_backend
  EXPECTED_SKILLS: mlflow-onboarding
