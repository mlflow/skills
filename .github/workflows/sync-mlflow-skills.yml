name: Sync skills to MLflow

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/sync-mlflow-skills.yml
      - .github/scripts/sync-mlflow-skills*.js
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test .github/scripts/sync-mlflow-skills.test.js

  sync:
    needs: test
    if: github.repository == 'mlflow/skills' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: sync-mlflow-skills-master
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest skills commit
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: 'mlflow', repo: 'skills', branch: 'main',
            });
            return data.commit.sha;

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mlflow
          repositories: mlflow
          permission-contents: write
          permission-pull-requests: write

      - name: Open or refresh MLflow PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ steps.source.outputs.result }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const sync = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sync-mlflow-skills.js`);
            await sync({
              github, core,
              sourceSha: process.env.SOURCE_SHA,
              appSlug: process.env.APP_SLUG,
            });
